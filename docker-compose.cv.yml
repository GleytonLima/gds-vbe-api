# Instancia do integrador para o ePHEM de Cabo Verde (API REST v2), complementar ao docker-compose.yml.
# Mesma imagem; muda o env_file (app/.env.cv) e o database (integracao_cv).
#
# Fica em arquivo separado para que um servidor sem app/.env.cv continue funcionando. Para ativar,
# coloque no arquivo .env ao lado deste (lido automaticamente pelo docker-compose):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.cv.yml
# O deploy do integrador reinicia integracaoapp-cv sempre que ele aparece em `docker-compose config --services`.
# Ver a secao "Instancia de Cabo Verde" no README.
version: "3"

services:
  # Com VIRTUAL_PATH em algum container de um host, o template do proxy so roteia os containers que
  # tambem tem VIRTUAL_PATH: o integrador da UnB precisa declarar "/" explicitamente ou sai do ar.
  # So vale quando este arquivo esta ativo (o compose mescla com o docker-compose.yml).
  integracaoapp:
    environment:
      VIRTUAL_PATH: /

  integracaoapp-cv:
    hostname: gds-integracao-cv-container
    image: gleytonlima/gds-ephem-integracao:${INTEGRACAO_CV_IMAGE_TAG:-latest}
    container_name: integracao-app-cv
    restart: unless-stopped
    depends_on:
      - integracaodb
    env_file:
      - app/.env.cv
    expose:
      - "8080"
    environment:
      # Mesmo host do integrador da UnB, no caminho /cv/: https://vbeapi.online/cv/api-integracao/v1/...
      # O nginx-proxy tira o /cv antes de repassar (VIRTUAL_DEST), entao o integrador nao muda.
      # Precisa de nginx-proxy 1.1 ou mais novo (suporte a VIRTUAL_PATH). Sem DNS nem certificado novos:
      # vale o do host, emitido pelo servico integracaoapp.
      # Em producao, defina INTEGRACAO_CV_HOST=prod.vbeapi.online no .env ao lado deste arquivo.
      VIRTUAL_HOST: ${INTEGRACAO_CV_HOST:-vbeapi.online}
      VIRTUAL_PATH: /cv/
      VIRTUAL_DEST: /
